[project]
name = "tcg-backend"
version = "0.1.0"
description = "TCG-exemple backend"
authors = [
    { name = "Samuel Simon-Pourquier", email = "samuel.simonpourqu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "openai>=3.23.0",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
